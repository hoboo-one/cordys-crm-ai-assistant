name: cordys-local
services:
  crm:
    image: 1panel/cordys-crm@sha256:1ec7b9a5e04a2f078d448f2ff1d687badbbca9393f8c94cca796596442765f05
    container_name: cordys-crm
    restart: unless-stopped
    volumes:
      - data:/opt/cordys
  assistant:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: [python, -B, /app/assistant.py]
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    volumes:
      - ./assistant/assistant.py:/app/assistant.py:ro
      - ./assistant/followup.py:/app/followup.py:ro
      - ./assistant/state:/state
      - ./mock-systems/crm-connections.json:/config/connections.json:ro
      - ./assistant/customer-map.json:/config/customer-map.json:ro
    secrets:
      - deepseek_key
  gateway:
    image: nginx:alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./assistant/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - "${TLS_CERT_FILE:?Set TLS_CERT_FILE in .env}:/etc/nginx/tls/localhost.crt:ro"
      - "${TLS_KEY_FILE:?Set TLS_KEY_FILE in .env}:/etc/nginx/tls/localhost.key:ro"
      - ./assistant/widget.js:/opt/widget/widget.js:ro
volumes:
  data:
    name: cordys-crm-data


secrets:
  deepseek_key:
    file: "${DEEPSEEK_KEY_FILE:?Set DEEPSEEK_KEY_FILE in .env}"



