map $http_upgrade $upgrade_connection {
    default upgrade;
    '' '';
}
map $uri $crm_modified_since {
    default $http_if_modified_since;
    / "";
    /index.html "";
}
map $uri $crm_etag {
    default $http_if_none_match;
    / "";
    /index.html "";
}
map $uri $crm_entry_cache {
    default "";
    / no-store;
    /index.html no-store;
}
server {
    listen 8081;
    listen 8443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=15s ipv6=off;
    client_max_body_size 0;
    location = /_local_assistant/widget.js {
        alias /opt/widget/widget.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
    location ~ ^/_local_assistant/(chat|order|complete|results|problems|plan|review)$ {
        set $assistant http://assistant:8000;
        proxy_pass $assistant;
        proxy_read_timeout 150s;
        client_max_body_size 4k;
    }
    location / {
        set $crm http://crm:8081;
        proxy_pass $crm;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $upgrade_connection;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-Modified-Since $crm_modified_since;
        proxy_set_header If-None-Match $crm_etag;
        add_header Cache-Control $crm_entry_cache;
        proxy_buffering off;
        proxy_read_timeout 1h;
        sub_filter '</body>' '<script defer src="/_local_assistant/widget.js"></script></body>';
    }
}
